<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Mucka packet intake</title></head><body>
<h1>Mucka packet review</h1><p>Use <a href="mucka-collector.html">My captures</a> to photograph and send a product for review.</p>
<!-- Static field blueprint for Netlify Forms. Never place received reports in this repository. -->
<form name="mucka-packet-review" method="POST" action="/capture-received.html" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="mucka-packet-review">
<input name="bot-field"><input name="reference"><input name="app-version"><input name="capture-id"><input name="report-type">
<input name="barcode"><input name="brand"><input name="product"><input name="pack"><textarea name="notes"></textarea>
<textarea name="reported-product"></textarea><input name="consent"><input name="subject">
<input type="file" name="front-photo"><input type="file" name="barcode-photo"><input type="file" name="ingredients-photo">
</form></body></html>
